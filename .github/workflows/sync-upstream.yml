name: Sync Upstream & Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Force a full run for testing, even if no new upstream version exists. Skips committing/tagging/pushing/releasing - uploads the built installer as a workflow artifact instead.'
        type: boolean
        default: false
      ignore_test_failures:
        description: 'Continue past failing tests instead of stopping the run. Use this to review a test failure manually (e.g. after an upstream change breaks something unrelated to this fork) and decide whether it should block a release. Combine with dry_run to review safely without publishing.'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  SIGN_CERT_THUMBPRINT: A0FF09C0D3E05BB557764E0A0758262821C13D2B
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
  ISS_PATH: EQLogParserInstall/EQLogParserInstall.iss
  UPDATECHECKER_PATH: EQLogParser/src/util/UpdateChecker.cs
  README_PATH: README.md

jobs:
  sync-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        shell: bash
        run: |
          # --no-tags: upstream's version tags must never land in our local refs/tags/* namespace.
          # Tag names collide by design (e.g. "2.3.59" means the same thing in both repos), so an
          # unqualified `git fetch --tags` (or even git's default auto tag-following, which pulls
          # in any tag reachable from newly-fetched history) would create a local tag for upstream's
          # release before we've actually merged and released it ourselves. That makes the
          # "Determine versions" step below think our fork is already caught up when it isn't -
          # upstream_tag is read via `git ls-remote` (unaffected), but local_tag is read via
          # `git tag -l`, which would wrongly include the just-fetched upstream tag.
          git remote add upstream https://github.com/kauffman12/EQLogParser.git
          git fetch upstream --no-tags master

      - name: Determine versions
        id: versions
        shell: bash
        run: |
          upstream_tag=$(git ls-remote --tags upstream | grep -v '\^{}' | awk -F'/' '{print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          local_tag=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Upstream latest tag: $upstream_tag"
          echo "Local latest tag: $local_tag"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "Forced dry run - proceeding regardless of version match."
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          elif [ "$upstream_tag" != "$local_tag" ]; then
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dry_run=${{ github.event.inputs.dry_run == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Merge upstream (auto-resolving known fork customizations)
        id: merge
        if: steps.versions.outputs.new_version == 'true'
        shell: bash
        run: |
          set +e
          git merge upstream/master --no-commit --no-ff
          set -e

          conflicted=$(git diff --name-only --diff-filter=U)

          if [ -z "$conflicted" ]; then
            echo "No conflicts."
            # --allow-empty: a dry run forced against an already-synced upstream has nothing to
            # merge (git leaves nothing staged), and this commit is thrown away with the runner
            # anyway in that case since dry runs never push.
            git commit --allow-empty -m "Merge upstream kauffman12/EQLogParser ${{ steps.versions.outputs.upstream_tag }}"
            echo "resolution=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only known, permanently-diverged files are safe to auto-resolve. If anything else
          # conflicted, don't attempt anything clever - bail out to manual resolution.
          unknown_conflicts=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              "$ISS_PATH"|"$UPDATECHECKER_PATH"|"$README_PATH") ;;
              # Upstream checks its own compiled installer into git under this same naming
              # convention, so once this fork tracks the same version number the two binaries
              # collide at an identical path. Content is irrelevant here - the "Package release
              # and publish" step later deletes stale exes and adds the freshly-built signed one
              # before the final commit, so whatever wins this conflict is a throwaway placeholder.
              Release/EQLogParser-install-*.exe) ;;
              *) unknown_conflicts="$unknown_conflicts$f"$'\n' ;;
            esac
          done <<< "$conflicted"

          if [ -n "$unknown_conflicts" ]; then
            echo "Conflicts include files outside the known auto-resolve set:"
            echo "$unknown_conflicts"
            git merge --abort
            echo "resolution=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "All conflicts are within the known auto-resolve set - reapplying known fork customizations on top of upstream's versions."
          failed=""

          if echo "$conflicted" | grep -qxF "$ISS_PATH"; then
            # Start from upstream's fully-updated file (picks up any new [Files] entries etc.),
            # then reapply the customizations that permanently diverge from upstream:
            #   - MyAppPublisher / MyAppURL (fork identity)
            #   - MyReleaseDir / MySrcDir / BackupUtilDir wrapped in #ifndef (so CI can override via /D)
            #   - CreateCustomForm call signature (this fork targets a newer Inno Setup API)
            # If you add other permanent customizations to this file later, extend the patches
            # and validation checks below to match, or this will fall back to manual resolution.
            git show upstream/master:"$ISS_PATH" > "$ISS_PATH"

            perl -i -pe '
              s/^#define MyAppPublisher ".*"$/#define MyAppPublisher "Unknown021"/;
              s|^#define MyAppURL ".*"$|#define MyAppURL "https://github.com/Unknown021/EQLogParser"|;
              s|^#define MyReleaseDir ".*"$|#ifndef MyReleaseDir\n  #define MyReleaseDir "C:\\Dev\\EQLogParser\\EQLogParser\\bin\\Release\\net8.0-windows10.0.17763.0"\n#endif|;
              s|^;#define MyReleaseDir ".*"$||;
              s|^#define MySrcDir ".*"$|#ifndef MySrcDir\n  #define MySrcDir "C:\\Dev\\EQLogParser\\EQLogParser"\n#endif|;
              s|^#define BackupUtilDir ".*"$|#ifndef BackupUtilDir\n  #define BackupUtilDir "C:\\Dev\\EQLogParser\\BackupUtil\\bin\\Release\\net8.0-windows10.0.17763.0"\n#endif|;
            ' "$ISS_PATH"

            perl -0777 -i -pe 's/Form := CreateCustomForm;\r?\n\s*Form\.ClientWidth := ScaleX\(358\);\r?\n\s*Form\.ClientHeight := ScaleY\(118\);/Form := CreateCustomForm(ScaleX(358), ScaleY(118), False, False);/' "$ISS_PATH"

            grep -q 'MyAppPublisher "Unknown021"' "$ISS_PATH" || failed="$failed $ISS_PATH:MyAppPublisher"
            grep -q 'MyAppURL "https://github.com/Unknown021/EQLogParser"' "$ISS_PATH" || failed="$failed $ISS_PATH:MyAppURL"
            grep -q '#ifndef MyReleaseDir' "$ISS_PATH" || failed="$failed $ISS_PATH:MyReleaseDir-guard"
            grep -q '#ifndef MySrcDir' "$ISS_PATH" || failed="$failed $ISS_PATH:MySrcDir-guard"
            grep -q '#ifndef BackupUtilDir' "$ISS_PATH" || failed="$failed $ISS_PATH:BackupUtilDir-guard"

            git add "$ISS_PATH"
          fi

          if echo "$conflicted" | grep -qxF "$UPDATECHECKER_PATH"; then
            # This file only diverges from upstream in one line: the GitHub repo it polls for
            # the latest release. Take upstream's version, then reapply that one swap.
            git show upstream/master:"$UPDATECHECKER_PATH" > "$UPDATECHECKER_PATH"

            sed -i 's|api\.github\.com/repos/kauffman12/EQLogParser/releases/latest|api.github.com/repos/Unknown021/EQLogParser/releases/latest|' "$UPDATECHECKER_PATH"

            grep -q 'api.github.com/repos/Unknown021/EQLogParser/releases/latest' "$UPDATECHECKER_PATH" || failed="$failed $UPDATECHECKER_PATH:repo-url"

            git add "$UPDATECHECKER_PATH"
          fi

          if echo "$conflicted" | grep -qxF "$README_PATH"; then
            # This file only diverges from upstream in three permanent ways: a "this is a fork"
            # disclaimer banner up top, an "and EQ Legends" mention of a fork-only feature, and the
            # download link (pointing at this fork's own Release dir instead of upstream's GitHub
            # release page). Take upstream's version (picks up any wording/requirements changes),
            # then reapply those three patches.
            git show upstream/master:"$README_PATH" > "$README_PATH"

            perl -0777 -i -pe '
              s{\A# EQLogParser\n}{This is NOT the original EQLogParser - This is a version with a few extra bells and whistles, maintained separately from the original EQLogParser\n\nSee the https://github.com/kauffman12/EQLogParser for the original EQLogParser\n\n------------------------\n\n# EQLogParser\n};
              s{P99/EMU Servers\.$}{P99/EMU Servers and EQ Legends.}m;
              s{^Link to DOWNLOAD the latest Installer:</br>\nhttps://\S+$}{Link to DOWNLOAD the latest Installer:</br>\nhttps://github.com/Unknown021/EQLogParser/tree/master/Release}m;
            ' "$README_PATH"

            grep -q 'This is NOT the original EQLogParser' "$README_PATH" || failed="$failed $README_PATH:banner"
            grep -q 'P99/EMU Servers and EQ Legends.' "$README_PATH" || failed="$failed $README_PATH:eq-legends"
            grep -q 'https://github.com/Unknown021/EQLogParser/tree/master/Release' "$README_PATH" || failed="$failed $README_PATH:download-link"

            git add "$README_PATH"
          fi

          while IFS= read -r f; do
            case "$f" in
              Release/EQLogParser-install-*.exe)
                git checkout --ours -- "$f"
                git add "$f"
                ;;
            esac
          done <<< "$conflicted"

          if [ -n "$failed" ]; then
            echo "Validation failed after reapplying patches:$failed - falling back to manual resolution."
            git merge --abort
            echo "resolution=manual" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Merge upstream kauffman12/EQLogParser ${{ steps.versions.outputs.upstream_tag }} (auto-resolved known fork customizations)"
            echo "resolution=auto-resolved" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on unresolved conflict
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution == 'manual'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the REST endpoint (gh api) rather than `gh issue create`: the latter goes through
          # GitHub's GraphQL createIssue mutation, which - independent of the issues:write/contents:write
          # permissions declared above - doesn't reliably authorize the Actions installation token
          # (see cli/cli#12798 and related community threads: "Resource not accessible by integration").
          # The plain REST issue-creation endpoint doesn't have this gap.
          gh api "repos/${{ github.repository }}/issues" --method POST \
            -f "title=Manual merge needed: upstream ${{ steps.versions.outputs.upstream_tag }}" \
            -f "body=Automatic sync found upstream released **${{ steps.versions.outputs.upstream_tag }}**, but merging \`upstream/master\` into \`master\` produced conflicts outside of what the workflow can safely auto-resolve.

          Resolve locally with:
          \`\`\`
          git fetch upstream
          git merge upstream/master
          # resolve conflicts
          git commit
          git push
          \`\`\`
          Once pushed, the next scheduled run will detect the repo is already up to date with upstream ${{ steps.versions.outputs.upstream_tag }} and continue on to the next release after that automatically. Nothing else needs to be done manually here."
          exit 1

      - name: Bump installer version
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        shell: bash
        run: |
          sed -i "s/#define MyAppVersion \"[^\"]*\"/#define MyAppVersion \"${{ steps.versions.outputs.upstream_tag }}\"/" "$ISS_PATH"

      - name: Inject Syncfusion license key
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        shell: pwsh
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          $path = "EQLogParser/App.xaml.cs"
          $needle = 'SyncfusionLicenseProvider.RegisterLicense("");'
          $content = Get-Content -Raw $path
          if (-not $content.Contains($needle)) {
            throw "Could not find empty SyncfusionLicenseProvider.RegisterLicense(`"`") placeholder to patch in $path"
          }
          $replacement = 'SyncfusionLicenseProvider.RegisterLicense("' + $env:SYNCFUSION_LICENSE_KEY + '");'
          $content = $content.Replace($needle, $replacement)
          Set-Content -Path $path -Value $content -NoNewline
          # Never commit this change - App.xaml.cs stays modified only in this ephemeral runner checkout.

      - name: Setup .NET
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build solution
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        shell: bash
        run: dotnet build EQLogParser.sln -c Release

      - name: Run tests
        id: tests
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        continue-on-error: ${{ github.event.inputs.ignore_test_failures == 'true' }}
        shell: bash
        run: |
          dotnet test EQLogParser.Test -c Release
          dotnet test EQLogParser.Wpf.Test -c Release

      - name: Warn on ignored test failures
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual' && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Tests failed but ignore_test_failures was set, so the run continued anyway. Review the 'Run tests' step log before trusting this build/release."
          {
            echo "## :warning: Tests failed but were ignored"
            echo "This run had \`ignore_test_failures\` enabled, so it continued past a failing \`dotnet test\` step instead of stopping. Review the **Run tests** step log above to decide whether the failure is meaningful before trusting this build/release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Inno Setup 7.0.2
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "innosetup-installer.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait

      - name: Import code signing certificate
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $securePwd = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd | Out-Null
          Remove-Item $pfxPath -Force

      - name: Compile installer
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $iscc = "C:\Program Files\Inno Setup 7\ISCC.exe"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "EQLogParser\bin\Release\net8.0-windows10.0.17763.0"
          $srcDir = Join-Path $env:GITHUB_WORKSPACE "EQLogParser"
          $backupUtilDir = Join-Path $env:GITHUB_WORKSPACE "BackupUtil\bin\Release\net8.0-windows10.0.17763.0"
          # $q is Inno Setup's own escape for a literal quote inside a /S value - needed because
          # wrapping the signtool.exe path (it has spaces) in a real `"` here would collide with
          # the quotes PowerShell adds around this whole argument when invoking ISCC.exe natively,
          # causing ISCC to see it split into multiple arguments ("You may not specify more than
          # one script filename").
          $signCmd = "`$q$signtool`$q sign /sha1 $env:SIGN_CERT_THUMBPRINT /fd SHA256 `$f"
          & $iscc "/DMyReleaseDir=$releaseDir" "/DMySrcDir=$srcDir" "/DBackupUtilDir=$backupUtilDir" "/Ssigntool=$signCmd" "$env:ISS_PATH"
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit code $LASTEXITCODE" }

      - name: Upload dry-run installer artifact
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual' && steps.versions.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-installer
          path: EQLogParserInstall/Output/*.exe
          retention-days: 7

      - name: Package release and publish
        if: steps.versions.outputs.new_version == 'true' && steps.merge.outputs.resolution != 'manual' && steps.versions.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.versions.outputs.upstream_tag }}"
          find Release -iname "EQLogParser-install-*.exe" ! -name "EQLogParser-install-$NEW_VERSION.exe" -delete
          cp "EQLogParserInstall/Output/EQLogParser-install-$NEW_VERSION.exe" "Release/EQLogParser-install-$NEW_VERSION.exe"
          git add Release "$ISS_PATH"
          git commit -m "$NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin master
          # Push the tag explicitly rather than relying on `--follow-tags` on the branch push
          # above: that flag only auto-pushes annotated tags, and `git tag` here creates a
          # lightweight one - relying on it silently leaves the tag local-only.
          git push origin "refs/tags/$NEW_VERSION"

          # Idempotency: if a prior run got this far and only failed on a later step (or on
          # this same gh call due to a transient API error), the tag/commit above are safe to
          # redo (both are no-ops against matching existing state), but re-running `gh release
          # create` against an existing release would hard-fail. Skip it in that case instead.
          # Use the REST endpoint directly (gh api) rather than `gh release view`: the latter
          # returned a false "found" once immediately after the tag push (observed on the
          # 2.3.61 run - `gh api .../releases/tags/...` moments later correctly 404'd), a bug
          # class we've already worked around elsewhere in this file (see the createIssue note
          # above) by preferring the plain REST call over the friendlier CLI wrapper.
          if gh api "repos/${{ github.repository }}/releases/tags/$NEW_VERSION" >/dev/null 2>&1; then
            echo "Release $NEW_VERSION already exists - skipping creation."
          else
            gh release create "$NEW_VERSION" "Release/EQLogParser-install-$NEW_VERSION.exe" \
              --title "$NEW_VERSION" \
              --notes "Automated sync of upstream kauffman12/EQLogParser release $NEW_VERSION."
          fi
